name: texfi_fokus
description: "TexFi f0kus — habit tracker и focus-таймер с адаптивными рекомендациями"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  collection: ^1.19.0

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.3

  # UI / UX
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  uuid: ^4.5.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Haptics
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  drift_dev: ^2.23.1
  build_runner: ^2.4.15

  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/

  # Шрифты лежат в репозитории, а не тянутся google_fonts по сети: на
  # устройстве без интернета (а приложение принципиально офлайновое)
  # загрузка молча проваливалась, и весь пиксельный шрифт подменялся
  # системным — интерфейс переставал быть пиксель-артом.
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: false
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0B0E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_round: "assets/icon/app_icon_round.png"
  min_sdk_android: 24
